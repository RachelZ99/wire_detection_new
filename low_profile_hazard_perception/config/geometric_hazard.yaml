geometric_hazard:
  ros__parameters:
    expected_width: 640
    expected_height: 360
    sensor_stale_after_ms: 500.0
    receive_stale_after_ms: 500.0
    health_publish_period_ms: 200.0
    input_processing_period_ms: 5.0
    camera_frame: camera_1_color_optical_frame
    base_frame: base_footprint
    color_image_topic: /camera_1/color/image_raw
    color_camera_info_topic: /camera_1/color/camera_info
    depth_image_topic: /camera_1/depth/image_raw
    depth_camera_info_topic: /camera_1/depth/camera_info
    odom_topic: /odom
    tf_topic: /tf
    tf_static_topic: /tf_static
    health_topic: /low_profile_hazard_perception/health
    hazard_cloud_topic: /low_profile_hazard_perception/confirmed_hazards
    candidate_diagnostics_topic: /low_profile_hazard_perception/candidate_diagnostics

    # Observed-ground profile for the measured 640x360 DCW2 stream.
    ground_sample_stride_px: 6
    ground_ransac_iterations: 160
    ground_ransac_score_max_samples: 1200
    ground_inlier_threshold_m: 0.008
    ground_minimum_support: 500
    ground_minimum_inlier_ratio: 0.70
    ground_maximum_p90_residual_m: 0.008
    ground_minimum_spatial_coverage: 0.35
    ground_minimum_temporal_consistency: 0.20
    ground_temporal_smoothing_factor: 0.35

    # Strong geometry begins at 15 mm and must have local metric support.
    geometry_sample_stride_px: 2
    strong_height_m: 0.015
    maximum_hazard_height_m: 0.15
    strong_minimum_support_points: 18
    strong_minimum_spatial_span_m: 0.04
    geometry_cluster_cell_m: 0.04

    # Weak height and narrow continuous invalid depth are support-only.
    # They can strengthen matching cable or strong geometry but never confirm alone.
    depth_evidence_sample_stride_px: 1
    weak_height_m: 0.006
    weak_ground_noise_multiplier: 3.0
    weak_minimum_support_points: 8
    weak_minimum_spatial_span_m: 0.04
    invalid_depth_minimum_pixels: 12
    invalid_depth_minimum_span_px: 12.0
    invalid_depth_maximum_width_px: 8.0

    # Formal RGB cable path: local paired-edge structure at native 640x360.
    # No parameter encodes a cable color and there is no large area gate.
    cable_local_contrast_threshold: 24.0
    cable_maximum_half_width_px: 3
    cable_minimum_component_pixels: 16
    cable_minimum_length_px: 16.0
    cable_minimum_apparent_width_px: 1.5
    cable_maximum_apparent_width_px: 6.0
    cable_minimum_width_consistency: 0.55
    cable_minimum_curve_continuity: 0.80
    cable_minimum_physical_span_m: 0.06
    cable_maximum_ground_age_ms: 500.0
    # Bounded event-time reorder buffer; this is not an RGB-depth synchronizer.
    rgb_reorder_capacity: 16

    # Optional legacy-style demo comparison. These values only produce a
    # diagnostic pixel count and can never create a hazard observation.
    diagnostic_pink_comparison_enabled: false
    diagnostic_pink_minimum_red: 90
    diagnostic_pink_minimum_red_over_green: 10
    diagnostic_pink_minimum_blue_over_green: 5
    diagnostic_pink_maximum_red_blue_difference: 60

    # Confirmation happens only after observation-time alignment in odom.
    association_radius_m: 0.08
    confirmation_window_ms: 350.0
    minimum_rgb_confirmation_confidence: 0.75
    candidate_retention_ms: 500.0
    # Safety floor: confirmed hazards survive the measured observation blind
    # zone for at least two seconds, even while sensing is degraded.
    confirmed_retention_ms: 2000.0
    retention_check_period_ms: 100.0
